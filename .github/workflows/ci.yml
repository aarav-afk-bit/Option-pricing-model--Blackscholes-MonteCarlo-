name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: options-backend
    steps:
      - uses: actions/checkout@v4
      # .python-version pins the exact release Render deploys (e.g. 3.11.9), but
      # GitHub only builds recent patch releases for new runner images, so an
      # exact pin fails before any test runs whenever ubuntu-latest moves on.
      # Test on the same major.minor with whatever patch the runner provides.
      - name: Read Python version
        id: python
        run: echo "minor=$(cut -d. -f1,2 .python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python.outputs.minor }}
          cache: pip
          cache-dependency-path: |
            options-backend/requirements.txt
            options-backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check . --output-format=github
      - run: python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check frontend scripts
        run: for f in options-frontend/js/*.js; do node --check "$f"; done
      - name: Frontend unit tests
        run: node --test 'options-frontend/tests/*.test.js'
      - name: Validate JSON data files
        run: for f in options-frontend/data/*.json options-backend/data/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done

  e2e:
    # Drives the dashboard in a real browser against the backend with a fake NSE.
    # Playwright publishes its system dependencies per Ubuntu release, so pin one it supports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read Python version
        id: python
        run: echo "minor=$(cut -d. -f1,2 options-backend/.python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python.outputs.minor }}
          cache: pip
          cache-dependency-path: options-backend/requirements.txt
      - run: pip install -r options-backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: options-frontend/tests/e2e/package-lock.json
      - name: Install Playwright
        working-directory: options-frontend/tests/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: options-frontend/tests/e2e
        run: npx playwright test
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: options-frontend/tests/e2e/test-results/
          retention-days: 7
